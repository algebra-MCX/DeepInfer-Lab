[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepInfer-Lab"
version = "0.1.0"
description = "An open lab for DeepInfer systems research, correctness validation, and end-to-end optimization"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "triton>=3.0",
    "transformers>=4.43",
    "safetensors",
    "tokenizers",
    "numpy",
    "huggingface_hub",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "sympy", "tilelang", "pillow"]  # the reference implementation used by tests/test_v41.py
mhc = [
    "tile-kernels==2.1.0; python_version >= '3.12'",
    "deep-gemm @ git+https://github.com/deepseek-ai/DeepGEMM.git@5081f8513af57e61696de4f4f04b0e707ffb503e ; python_version >= '3.12'",
]

[tool.setuptools.packages.find]
include = ["deepinfer_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU"]
