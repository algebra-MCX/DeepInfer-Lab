name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers triton safetensors tokenizers numpy huggingface_hub tqdm pytest
          python -m pip install --no-deps .
      - name: Verify installed package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from deepinfer_lab import LLM, SamplingParams

          print("DeepInfer-Lab:", version("DeepInfer-Lab"))
          print("Public API:", LLM.__name__, SamplingParams.__name__)
          PY
      - name: Run CPU tests
        run: pytest -q -m "not gpu"
      - name: Verify GPU suite is collected
        run: |
          collected=$(pytest --collect-only -q -m gpu | awk '/::/ {count++} END {print count + 0}')
          test "$collected" -gt 0
          echo "GPU tests collected: $collected"
      - name: Compile and check whitespace
        run: |
          python -m compileall -q deepinfer_lab tests
          git diff --check
